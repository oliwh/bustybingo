<!DOCTYPE html>
<html>
    <head>
        <title>BUSTy Bingo! - Website designed by Oliver Woodhouse</title>
        <link rel="icon" type="image/x-icon" href="bustlogo.ico">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Frijole&family=Gluten&display=swap" rel="stylesheet">
        <script src="papaparse.min.js"></script>
        <script src="script.js"></script>
    </head>
    <nav style="z-index: 1000; position: relative;">
        <button class="undo" type="button" onclick="undo(data)">undo pls</button>
    </nav>
    <body>
        <div class="center" style="transform: translateY(-50px);">
            <h1 class="title">BUSTy Bingo!</h1>
        </div>
        <div class="center" style="transform: translateY(-50px);">
            <button class="draw" id="drawID" type="button" onclick="numGen(data)">Let's go gambling!</button>
        </div>
        <div class="center" style="transform: translateY(-50px);">
            <h2 style="font-size: 50px;">Recent Numbers:</h2>
        </div>
        <div class="center" style="transform: translateY(-50px);">
            <p id="recent" style="font-size: 36px; transform: translateY(-100%);" ></p>
        </div>
        <div id="myModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h1>And the number is...</h1>
                <h2 id="modalNum"></h2>
                <h3 id="modalMod"></h3>
            </div>
        </div>
        <div class="center">
            <div id="buttonGrid" class="grid"></div>
        </div>
    </body>
</html>
